server:
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: moviego

  web:
    resources:
      add-mappings: false

  jpa:
    database-platform: H2
    hibernate:
      ddl-auto: create
    database: h2
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    username: ${DB_USER_NAME} # 환경 변수
    password: ${DB_PWD} # 환경 변수
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test

  # mail
  mail:
    sender-email: ${SENDER_EMAIL}
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ID}
    password: ${MAIL_PW}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 1800000

  # redis
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST}
  cache:
    type: redis

  # jwt
  jwt:
    secret: ${JWT_SECRET}
    access:
      expire: 900000
    refresh:
      expire: 86400000

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_API_KEY}
            client-secret: ${KAKAO_SECRET_KEY}
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant_type: authorization_code
            scope:
              - profile_nickname
              - account_email
            client-name: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # multipart
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

r2:
  bucketName: ${R2_BUCKET_NAME}
  endpointUrl: ${R2_ENDPOINT_URL}
  region: APAC
  accessKey: ${R2_ACCESS_KEY}
  secretKey: ${R2_SECRET_KEY}

logging:
  level:
    org.hibernate.SQL: debug
